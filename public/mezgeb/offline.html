<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0E1311" />
    <title>Offline · Mezgeb</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #0e1311; color: #eef3ef; }
      body {
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; box-sizing: border-box; text-align: center;
      }
      .mark { width: 56px; height: 56px; border-radius: 18px; background: #c4f06a; display: grid; place-items: center; }
      .mark img { width: 56px; height: 56px; border-radius: 18px; }
      h1 { margin: 0; font-size: 22px; font-weight: 700; }
      p { margin: 0; color: #a3b1aa; max-width: 320px; }
      button {
        height: 52px; padding: 0 28px; border: 0; border-radius: 16px; background: #c4f06a; color: #10140f;
        font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #c4f06a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div class="mark"><img src="/mezgeb/icons/icon-192.png" alt="" /></div>
    <h1>You are offline</h1>
    <p>Mezgeb reads your ledger from the database, and nothing is stored on this phone. Connect to the internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
